function probe(node,sample){
 const internal=node.matches('.annotationContent')?node:node.querySelector('.internal'),style=getComputedStyle(internal),box=internal.getBoundingClientRect();
 const w=sample.rotation%180?sample.rect[3]-sample.rect[1]:sample.rect[2]-sample.rect[0],h=sample.rotation%180?sample.rect[2]-sample.rect[0]:sample.rect[3]-sample.rect[1];

 // differently at some fractional pixel sizes. Markers never enter serialization.

function compareLayout(actual,expected,label){check(actual.lines.length===expected.lines.length,`${label}: line count changed ${JSON.stringify({actual:actual.lines.map(l=>l.text),expected:expected.lines.map(l=>l.text)})}`);actual.lines.forEach((line,i)=>{const e=expected.lines[i];check(line.text===e.text,`${label}: wrapping differs at line ${i}`);near(line.x,e.x,label+' x');near(line.baseline,e.baseline,label+' baseline');});}
async function readPreview(){await reader.annotation('read');for(const sample of samples){reader.goToPage(sample.page);await frames();const page=document.querySelector(`.page[data-page-number="${sample.page}"]`);let content;await wait(()=>{content=Array.from(page.querySelectorAll('.annotationContent.freetext,.freeTextEditor')).find(n=>n.getBoundingClientRect().width>0);return !!content;});compareLayout(probe(content,sample),layouts.get(sample.page),'read preview');}}
function inspect(saved,sample,expected){
 const doc=mupdf.PDFDocument.openDocument(saved,'application/pdf'),page=doc.loadPage(sample.page-1),annotation=page.getAnnotations().find(a=>a.getType()==='FreeText'),obj=annotation.getObject(),ap=obj.get('AP').get('N');
 check(obj.get('Contents').asString()===sample.text,'saved /Contents differs');const rect=obj.get('Rect').asJS();rect.forEach((v,i)=>near(v,sample.rect[i],'saved Rect',.04));check(obj.get('Rotate').asNumber()===sample.rotation,'annotation rotation changed');
 const bbox=ap.get('BBox').asJS(),matrix=ap.get('Matrix').asJS();near(bbox[2],expected.w,'BBox width');near(bbox[3],expected.h,'BBox height');
 const transformed=[[0,0],[bbox[2],0],[0,bbox[3]],[bbox[2],bbox[3]]].map(([x,y])=>[matrix[0]*x+matrix[2]*y+matrix[4],matrix[1]*x+matrix[3]*y+matrix[5]]);
 near(Math.min(...transformed.map(p=>p[0])),0,'Matrix x origin');near(Math.min(...transformed.map(p=>p[1])),0,'Matrix y origin');near(Math.max(...transformed.map(p=>p[0])),rect[2]-rect[0],'Matrix x extent');near(Math.max(...transformed.map(p=>p[1])),rect[3]-rect[1],'Matrix y extent');
 const stream=ap.readStream().asString(),lines=[...stream.matchAll(/BT 1 0 0 1 ([\d.-]+) ([\d.-]+) Tm \/AUPW ([\d.]+) Tf [\d.]+ TL <([0-9a-f]+)> Tj ET/g)];
 check(lines.length===expected.lines.length,`layout mismatch: editor ${expected.lines.length} lines, saved AP ${lines.length} lines`);
 lines.forEach((match,i)=>{const line=expected.lines[i],hex=[...line.text].map(c=>fullFont.encodeCharacter(c).toString(16).padStart(4,'0')).join('');check(match[4]===hex,'saved glyph sequence/wrap differs');near(Number(match[1]),line.x,'AP x');near(bbox[3]-Number(match[2]),line.baseline,'AP baseline');near(Number(match[3]),sample.fontSize,'AP font size');const advance=[...line.text].reduce((sum,c)=>sum+fullFont.advanceGlyph(fullFont.encodeCharacter(c))*sample.fontSize,0);check(Number(match[1])+advance<=bbox[2]+.05,'saved line clipped horizontally');check(Number(match[2])-sample.fontSize*.2>=-.05,'saved line clipped vertically');});

}
function mask(canvas,bg){const p=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data,out=[];for(let y=0;y<canvas.height;y++)for(let x=0;x<canvas.width;x++){const i=(y*canvas.width+x)*4;if(Math.max(...bg.map((v,j)=>Math.abs(p[i+j]-v)))>8)out.push([x,y]);}return out;}
function coverage(a,b){const set=new Set(b.map(([x,y])=>`${x},${y}`));return a.filter(([x,y])=>{for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)if(set.has(`${x+dx},${y+dy}`))return true;return false;}).length/a.length;}
async function raster(saved,sample,layout){

 const points=[...viewport.convertToViewportPoint(sample.rect[0],sample.rect[1]),...viewport.convertToViewportPoint(sample.rect[2],sample.rect[3])],left=Math.min(points[0],points[2]),top=Math.min(points[1],points[3]),actual=document.createElement('canvas');actual.width=Math.ceil(layout.w*2);actual.height=Math.ceil(layout.h*2);actual.getContext('2d').drawImage(canvas,left,top,layout.w*2,layout.h*2,0,0,layout.w*2,layout.h*2);

}
try{
 await open(editorFixture('Synthetic body only'));reader.zoom(1);await frames();

 await artifact('font-appearance.pdf',saved);stage='reopen';await open(saved);

 for(const sample of samples){stage='edit existing page '+sample.page;reader.zoom(1);const node=await select(sample.page);click(node);reader.textEdit();await frames();const internal=node.querySelector('.internal');sample.text='再次编辑 α ≤ β。\n\nEnglish text can wrap after resizing. 中文末句。';internal.replaceChildren(...sample.text.split('\n').map(line=>{const d=document.createElement('div');d.append(line?document.createTextNode(line.replaceAll(' ','\xa0')):document.createElement('br'));return d;}));const caret=internal.lastChild.firstChild;document.getSelection().collapse(caret,caret.length);await frames();check(document.getSelection().anchorNode===caret&&document.getSelection().anchorOffset===caret.length,'space normalization moved caret');internal.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText'}));await reader.testWriterBytes();sample.rect=sample.rect.map((v,i)=>v+(i<2?8:28));reader.resizeText(sample.rect);sample.fontSize=15;reader.textSize(15);await frames();await reader.testWriterBytes();await frames();layouts.set(sample.page,probe(node,sample));check(state.dirty,'edit not marked dirty');}

 const revisedCandidate=await reader.testWriterBytes();saved=appendAnnotationRevision(mupdf,revisedCandidate,fontBytes,openedBytes).bytes;
 for(const sample of samples){stage='verify edited page '+sample.page;inspect(saved,sample,layouts.get(sample.page));await raster(saved,sample,layouts.get(sample.page));}
 await open(saved);for(const sample of samples){stage='reopen edited page '+sample.page;compareLayout(probe(await select(sample.page),sample),layouts.get(sample.page),'reopen edited');}
 stage='overflow refuses output';const s=samples[0],node=await select(1);click(node);reader.resizeText([s.rect[0],20,s.rect[0]+70,45]);await frames();const tooSmall=await reader.testWriterBytes();let refused=false;try{appendAnnotationRevision(mupdf,tooSmall,fontBytes,openedBytes);}catch(e){refused=e.code==='writer_text_overflow';}check(refused,'overflow silently saved');

}catch(error){const lastState=state;await reader.dispose().catch(()=>{});await report({status:'FAIL',stage,error:String(error),cases,state:lastState});}
