// Independent oracle: project the PDF rectangle through PDFPageProxy's public
// viewport, then use the actual visible canvas CSS bounds. DPR is deliberately
// not multiplied into screen geometry; it affects canvas backing pixels only.
async function projected(pageNumber,rect){
  const page=await reader.getPage(pageNumber),viewport=page.getViewport({scale:1});

  const r=[...viewport.convertToViewportPoint(rect[0],rect[1]),...viewport.convertToViewportPoint(rect[2],rect[3])],sx=bounds.width/viewport.width,sy=bounds.height/viewport.height;
  return {left:bounds.left+Math.min(r[0],r[2])*sx,top:bounds.top+Math.min(r[1],r[3])*sy,
    right:bounds.left+Math.max(r[0],r[2])*sx,bottom:bounds.top+Math.max(r[1],r[3])*sy};
}
function glyphRects(internal){
  const walker=document.createTreeWalker(internal,NodeFilter.SHOW_TEXT),rects=[];
  for(let node=walker.nextNode();node;node=walker.nextNode()){
    if(!node.textContent.trim())continue;const range=document.createRange();range.selectNodeContents(node);
    rects.push(...[...range.getClientRects()].filter(r=>r.width>0&&r.height>0));range.detach();
  }
  return rects;
}
function writeEditable(body,text){body.replaceChildren(...text.split('\n').map(line=>{const node=document.createElement('div');node.textContent=line;return node;}));body.dispatchEvent(new InputEvent('input',{bubbles:true,inputType:'insertText',data:text}));}
function rgb(value){const numbers=value.match(/[\d.]+/g)?.map(Number);return numbers?.length>=3?numbers:null;}
function luminance(value){return value.slice(0,3).map(n=>{const s=n/255;return s<=.04045?s/12.92:((s+.055)/1.055)**2.4;}).reduce((n,x,i)=>n+x*[.2126,.7152,.0722][i],0);}
function contrast(a,b){const x=luminance(a),y=luminance(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
async function pageBackground(pageNumber,rect){
  const expected=await projected(pageNumber,rect),canvas=pageNode(pageNumber).querySelector('.canvasWrapper canvas');check(canvas,'rendered PDF canvas missing');
  const bounds=canvas.getBoundingClientRect(),x=Math.floor(((expected.left+expected.right)/2-bounds.left)*canvas.width/bounds.width),y=Math.floor(((expected.top+expected.bottom)/2-bounds.top)*canvas.height/bounds.height);
  check(x>=0&&y>=0&&x<canvas.width&&y<canvas.height,'background sample escaped the rendered page');
  return [...canvas.getContext('2d').getImageData(x,y,1,1).data];
}
async function painted(pageNumber,rect,dark){
  for(let index=0;index<120;index++){const color=await pageBackground(pageNumber,rect);if(color[3]===255&&(dark?Math.max(...color.slice(0,3))<40:Math.min(...color.slice(0,3))>240))return;await sleep(25);}
  throw Error(`${stage}: synthetic page canvas did not paint the expected background`);
}

async function geometry(pageNumber,rect,{handles=true,fontSize=12,color='#000000'}={}){
  await frames();const editor=selectedEditor();check(editor?.classList.contains('freeTextEditor'),'selected normal FreeText editor missing');
  const expected=await projected(pageNumber,rect),bounds=editor.getBoundingClientRect();

  // of padding. Keep that documented allowance plus a one-CSS-pixel border,
  // while rejecting large offsets, swapped dimensions and auto-shrunk boxes.
  // The normal editor intentionally offsets its content origin by its scaled
  // 2-PDF-unit padding and a constant 2-CSS-pixel selection outline. Predict
  // that contract independently; do not loosen a tolerance to hide a mismatch.
  const inset=2*state.scale*4/3+2;
  for(const edge of ['left','top','right','bottom'])near(bounds[edge],expected[edge]-inset,2,`editor ${edge}`);

  // not pretend that a temporary HTML paper background will exist in the PDF.
  const paper=await pageBackground(pageNumber,rect);check(paper[3]===255,'PDF background sample is not opaque');
  check(contrast(actualColor,paper)>=4.5,'FreeText color/background contrast is below 4.5');

    check(nodes.length===8,'eight owned resizing handles are required');
    check(new Set(nodes.map(n=>n.dataset.handle)).size===8,'handle identities are not distinct');
    const targets=[[bounds.left,bounds.top],[(bounds.left+bounds.right)/2,bounds.top],[bounds.right,bounds.top],[bounds.right,(bounds.top+bounds.bottom)/2],[bounds.right,bounds.bottom],[(bounds.left+bounds.right)/2,bounds.bottom],[bounds.left,bounds.bottom],[bounds.left,(bounds.top+bounds.bottom)/2]];

async function dragFormalHandle(pageNumber,rect,color){

  check(handles.length===8&&handles.every(node=>!node.disabled),'new native FreeText resizing handles must all be enabled');
  // Select the *screen* bottom-right grip. Its editor-local label can differ
  // after rotation; the expected PDF delta is independently inverse-projected.
  const grip=handles.map(node=>{const r=node.getBoundingClientRect();return {node,x:r.left+r.width/2,y:r.top+r.height/2};})
    .sort((a,b)=>Math.hypot(a.x-bounds.right,a.y-bounds.bottom)-Math.hypot(b.x-bounds.right,b.y-bounds.bottom))[0];
  const dx=14,dy=12,input={bubbles:true,cancelable:true,button:0,pointerId:41,pointerType:'mouse',isPrimary:true,clientX:grip.x,clientY:grip.y};
  const original=await projected(pageNumber,rect),page=await reader.getPage(pageNumber),v=page.getViewport({scale:1}),canvas=pageNode(pageNumber).querySelector('.canvasWrapper').getBoundingClientRect();
  const a=v.convertToPdfPoint((original.left-canvas.left)*v.width/canvas.width,(original.top-canvas.top)*v.height/canvas.height),
    b=v.convertToPdfPoint((original.right+dx-canvas.left)*v.width/canvas.width,(original.bottom+dy-canvas.top)*v.height/canvas.height);

  reader.edit('undo');await frames();await geometry(pageNumber,rect,{color});
  reader.edit('redo');await frames();await geometry(pageNumber,target,{color});

}

async function disposeHarness(){if(harness){await unmount(harness);harness=null;}harnessHost?.remove();harnessHost=null;}
async function newHarness(pageNumber,rect){

  let reason=null;const sourceRect=[rect[0]+8,rect[1]+8,rect[0]+88,rect[1]+58];

async function temporaryGeometry(pageNumber,rect){

  near(parseFloat(getComputedStyle(content).fontSize),12*state.scale*4/3,.35,'temporary CSS font size');

  const glyphs=glyphRects(content);check(glyphs.length>=2,'temporary multiline reply was not visibly rendered');

async function dragTemporary(pageNumber,rect,resize=false){
  const node=harnessHost.querySelector(resize?'.inline-resize':'.drag-title'),bounds=node.getBoundingClientRect(),dx=resize?16:12,dy=resize?12:9;
  const startX=bounds.left+bounds.width/2,startY=bounds.top+bounds.height/2,input={bubbles:true,cancelable:true,button:0,pointerId:24,clientX:startX,clientY:startY};
  node.dispatchEvent(new PointerEvent('pointerdown',input));await frames();

  window.dispatchEvent(new PointerEvent('pointerup',{...input,clientX:startX+dx,clientY:startY+dy}));await frames();

async function temporaryRound(pageNumber,rect,rotation){

    stage=`temporary page${pageNumber} rotation${rotation} zoom${zoom} DPR${devicePixelRatio}`;
    reader.zoom(zoom);await wait(()=>Math.abs(state.scale-zoom)<.001,'temporary PDF zoom did not synchronize');await frames();

    const details=harnessHost.querySelector('[aria-label="编辑原位问题"]');details.click();await frames();check(!harnessHost.querySelector('.inline-content'),'Prompt and answer displayed together');rectNear(harness.snapshot().rect,rect,0,'edit changed the answer PDF Rect');harnessHost.querySelector('[aria-label="发送原位问题"]').click();await wait(()=>harnessHost.querySelector('[aria-label="确认批注"]')?.disabled===false,'edited prompt did not return answer');await frames();
